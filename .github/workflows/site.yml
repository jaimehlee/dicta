name: Dicta site

# Runs in two cases:
#  1. Every weekday morning: look for new earnings releases on SEC EDGAR,
#     save them to data/pending.json, open an issue if there's something to
#     review, then redeploy the site.
#  2. Whenever someone commits to main (for example, adding approved quotes):
#     check the data files and redeploy. If the check fails, the old site stays up.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1-5"   # 11:17 UTC on weekdays, early morning in Ontario
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: dicta-site
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look for new earnings releases on SEC EDGAR
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/fetch_filings.py
      - name: Save the to-review list
        run: |
          git config user.name "dicta-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily filing check"
            git push
          fi
      - name: Open an issue when there's something new to review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f review-note.md ]; then
            gh issue create --title "New earnings releases to review ($(date -u +%Y-%m-%d))" --body-file review-note.md
          fi

  deploy:
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the data files
        run: python scripts/validate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
